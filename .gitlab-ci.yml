# This .gitlab-ci.yml file will validate MR Title and Description check

stages:
  - policy
  - build
  - check

variables:
  GIT_STRATEGY: none
  CI_SERVER_URL: "https://gitlab.intra.infineon.com"

# Merge Request Description Validation
git_mr_validation:
  stage: policy
  tags:
    - ifx-linux-container
  image: docker-ifxsource-registry.vih.infineon.com/linux/ubuntu-20.04/mtb-assets:latest
  script:
    - rm -rf devops_scripts
    - git clone --depth=1 --no-progress ${CI_SERVER_URL}/devops/devops_scripts.git
    - devops_scripts/job_merge_request_policy.sh --fmac-mr-title-check
    - devops_scripts/job_merge_request_policy.sh --fmac-mr-description-check
  only:
    - merge_requests

build-u03:
  stage: build
  tags:
    - linux-fmac-devu03 
  script:
    - pwd
    - ls -altr
    - rm -rf fmac_build_scripts
    - git clone git@gitlab.intra.infineon.com:linux/fmac_build_scripts.git
    - cd fmac_build_scripts
    - git clone --reference /proj_netapp/iot_ws/wlan/gitlab-runner/ref_mirror_fmac/brcm80211.git git@gitlab.intra.infineon.com:linux/brcm80211.git
    - mv brcm80211 brcm80211_private
    - cd brcm80211_private
    - echo ${CI_COMMIT_REF_NAME}
    - git fetch origin ${CI_COMMIT_REF_NAME}
    - echo ${CI_COMMIT_SHA}
    - git checkout ${CI_COMMIT_SHA}
    - git log -1
    - cd ..
    - ./build_modules.sh x86_64-5.4.21 private --debug
  only:
    - merge_requests

build-2020uv:
  stage: build
  tags:
    - alc-2020uv-itool 
  script:
    - pwd
    - ls -altr
    - rm -rf fmac_build_scripts
    - git clone git@gitlab.intra.infineon.com:linux/fmac_build_scripts.git
    - cd fmac_build_scripts
    - git clone --reference /proj_netapp/iot_ws/wlan/gitlab-runner/ref_mirror_fmac/brcm80211.git git@gitlab.intra.infineon.com:linux/brcm80211.git
    - mv brcm80211 brcm80211_private
    - cd brcm80211_private
    - echo ${CI_COMMIT_REF_NAME}
    - git fetch origin ${CI_COMMIT_REF_NAME}
    - echo ${CI_COMMIT_SHA}
    - git checkout ${CI_COMMIT_SHA}
    - git log -1
    - cd ..
    - ./build_modules.sh x86_64-6.1.19 private --debug
  only:
    - merge_requests

patch_check:
  stage: check
  tags:
    - linux-fmac-devu03
  script:
    - git clone --reference /proj_netapp/iot_ws/wlan/gitlab-runner/ref_mirror_fmac/brcm80211.git git@gitlab.intra.infineon.com:linux/brcm80211.git
    - cd brcm80211
    - git diff remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME remotes/origin/$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME > ${CI_MERGE_REQUEST_IID}.diff
    - ./scripts/checkpatch.pl ${CI_MERGE_REQUEST_IID}.diff
  allow_failure: true
  only:
    - merge_requests
  after_script:
    - 'rm -rf brcm80211'